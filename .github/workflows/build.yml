name: build-video
on:
  push:
    paths: ["jobs/*.json"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install edge-tts
      - run: for f in jobs/*.json; do python build.py "$f"; done
      - uses: actions/upload-artifact@v4
        with: { name: videos, path: out/*.mp4 }
