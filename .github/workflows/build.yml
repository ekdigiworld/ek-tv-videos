name: build-video
on:
  push:
    paths: ["jobs/*.json"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts
          ffmpeg -version | head -1
      - name: Build videos
        run: |
          shopt -s nullglob
          files=(jobs/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JSON files found in jobs/"; exit 1
          fi
          for f in "${files[@]}"; do python build.py "$f"; done
      - uses: actions/upload-artifact@v4
        with: { name: videos, path: out/*.mp4 }
